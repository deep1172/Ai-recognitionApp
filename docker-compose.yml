version: '3.8'

services:
  frontend:
    build:
      context: .
    ports:
      - "3000:3000"
    depends_on:
      - backend
    env_file: 
      - .env.local

  backend:
    build:
      context: ./server
    ports:
      - "5000:5000"
    env_file:
      - .env.local
    depends_on:
      - mongo

  mongo:
    image: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
